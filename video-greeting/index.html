<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1350" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1080px;
        height: 1350px;
        overflow: hidden;
        background: transparent;
      }
      #root { position: relative; width: 1080px; height: 1350px; }

      /* Character drawn in its source pixel space (1101 x 1429), scaled to fit. */
      #stage {
        position: absolute;
        left: 45px;
        top: 50px;
        width: 1101px;
        height: 1429px;
        transform-origin: 0 0;
        scale: 0.9;
      }
      #char {
        position: absolute;
        inset: 0;
        transform-origin: 550px 1429px;
      }
      #char img { position: absolute; display: block; }
      #body { left: 0; top: 0; width: 1101px; height: 1429px; }
      #arm {
        left: 762px; top: 458px; width: 321px; height: 526px;
        transform-origin: 38px 517px; /* elbow */
      }
      #eye { left: 429px; top: 210px; width: 238px; height: 236px; }

      .bubble {
        position: absolute;
        border-radius: 50%;
        background: radial-gradient(circle at 32% 30%, rgba(255,255,255,0.95) 0 12%, rgba(190,225,255,0.55) 30%, rgba(80,160,235,0.35) 70%, rgba(40,120,220,0.6) 100%);
        box-shadow: inset -3px -4px 8px rgba(30,90,200,0.35);
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="3" data-width="1080" data-height="1350">
      <div id="stage" class="clip" data-start="0" data-duration="3" data-track-index="0" data-layout-allow-overflow data-layout-allow-overlap>
        <div id="char">
          <img id="body" src="assets/body.png" alt="" />
          <img id="eye" src="assets/eye_open.png" alt="" />
          <img id="arm" src="assets/arm.png" alt="" />
        </div>
        <div id="b1" class="bubble" style="left:300px;top:150px;width:34px;height:34px"></div>
        <div id="b2" class="bubble" style="left:760px;top:120px;width:26px;height:26px"></div>
        <div id="b3" class="bubble" style="left:540px;top:60px;width:20px;height:20px"></div>
        <div id="b4" class="bubble" style="left:860px;top:300px;width:22px;height:22px"></div>
        <div id="b5" class="bubble" style="left:420px;top:40px;width:16px;height:16px"></div>
      </div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      const io = "sine.inOut";

      // Idle breathing: the whole figure swells a hair, twice.
      tl.fromTo("#char", { scaleY: 1 }, { scaleY: 1.006, duration: 0.75, ease: io, repeat: 3, yoyo: true }, 0);

      // Greeting wave: anticipation back, then a decaying wave from the elbow.
      tl.fromTo("#arm", { rotation: 0 }, { rotation: 4, duration: 0.3, ease: "power1.out" }, 0)
        .to("#arm", { rotation: -7, duration: 0.3, ease: io }, 0.3)
        .to("#arm", { rotation: 5, duration: 0.3, ease: io }, 0.6)
        .to("#arm", { rotation: -5, duration: 0.3, ease: io }, 0.9)
        .to("#arm", { rotation: 2.5, duration: 0.28, ease: io }, 1.2)
        .to("#arm", { rotation: 0, duration: 0.35, ease: "power2.out" }, 1.48);

      // Body follows the wave a beat late, smaller, with a soft bob.
      tl.fromTo("#char", { rotation: 0, y: 0 }, { rotation: 0.6, y: -4, duration: 0.38, ease: io }, 0.08)
        .to("#char", { rotation: -0.7, y: 0, duration: 0.3, ease: io }, 0.46)
        .to("#char", { rotation: 0.5, y: -3, duration: 0.3, ease: io }, 0.76)
        .to("#char", { rotation: -0.3, y: 0, duration: 0.3, ease: io }, 1.06)
        // lean in toward the winking side before the wink
        .to("#char", { rotation: -1.6, y: -6, duration: 0.32, ease: "power2.inOut" }, 1.4)
        // settle back with a small overshoot
        .to("#char", { rotation: 0.35, y: 0, duration: 0.45, ease: "power2.inOut" }, 2.12)
        .to("#char", { rotation: 0, duration: 0.35, ease: io }, 2.57);

      // One wink: quick close, hold, slightly slower open.
      tl.fromTo("#eye", { opacity: 1 }, { opacity: 0, duration: 0.09, ease: "power2.in" }, 1.66)
        .to("#eye", { opacity: 1, duration: 0.18, ease: "power2.out" }, 2.02);

      // Loose bubbles drift up and fade.
      [["#b1", -150, -12, 0.0], ["#b2", -170, 14, 0.25], ["#b3", -130, -8, 0.6], ["#b4", -160, 10, 0.9], ["#b5", -120, 6, 1.3]]
        .forEach(([id, dy, dx, at]) => {
          tl.fromTo(id, { y: 0, x: 0, opacity: 0, scale: 0.6 }, { opacity: 0.95, scale: 1, duration: 0.3, ease: "power1.out" }, at)
            .to(id, { y: dy, x: dx, duration: 1.6, ease: "sine.out" }, at)
            .to(id, { opacity: 0, scale: 1.15, duration: 0.25, ease: "power1.in" }, Math.min(at + 1.35, 2.74));
        });

      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
