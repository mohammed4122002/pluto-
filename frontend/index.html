<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>لوحة تحكم العيادة</title>
    <script>
      // Applied before first paint so a stored preference doesn't flash the
      // wrong theme for a frame -- an inline <script> in <head> blocks
      // rendering until it runs, same trick every dark-mode-capable site
      // uses. No preference stored means no attribute set, which leaves
      // index.css's prefers-color-scheme media query to decide.
      (function () {
        var saved = localStorage.getItem("pluto_theme");
        if (saved === "light" || saved === "dark") {
          document.documentElement.setAttribute("data-theme", saved);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
