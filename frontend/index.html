<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>لوحة تحكم العيادة</title>
    <script>
      // Applied before first paint so a stored preference doesn't flash the
      // wrong theme for a frame -- an inline <script> in <head> blocks
      // rendering until it runs, same trick every dark-mode-capable site
      // uses. The resolved theme is always stamped, even when it just
      // mirrors the OS: the stylesheet's `dark:` variant keys off the
      // attribute, so "no attribute" must never be a state the app renders in.
      (function () {
        var saved = localStorage.getItem("pluto_theme");
        var theme =
          saved === "light" || saved === "dark"
            ? saved
            : window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
        document.documentElement.setAttribute("data-theme", theme);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
