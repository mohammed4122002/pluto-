name: CI

# The suites existed long before this workflow did, which meant they only ran
# when someone remembered to run them. Every check here is one that was
# already being run by hand -- this just makes skipping it impossible.

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same PR makes the older run's answer irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        working-directory: backend
        run: |
          pip install -r requirements.txt
          pip install pytest
      - name: Run tests
        working-directory: backend
        # The suite never reaches a real database -- every test builds its own
        # in-memory double. These are set only so that importing app.core.config
        # can't fail on a missing required field.
        env:
          SUPABASE_URL: http://localhost
          SUPABASE_SERVICE_KEY: ci-not-a-real-key
          JWT_SECRET: ci-not-a-real-secret
          ENCRYPTION_KEY: ci-not-a-real-encryption-key
        run: python -m pytest -q

  ai-services:
    name: ai-services tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ai-services/requirements.txt
      - name: Install dependencies
        working-directory: ai-services
        run: |
          pip install -r requirements.txt
          pip install pytest
      - name: Run tests
        working-directory: ai-services
        # PLUTO_LIVE_LLM_TESTS is deliberately left unset: the live-model tests
        # are opt-in, cost money, and are a sample of a nondeterministic model
        # rather than a pass/fail gate.
        env:
          SUPABASE_URL: http://localhost
          SUPABASE_SERVICE_KEY: ci-not-a-real-key
          ENCRYPTION_KEY: ci-not-a-real-encryption-key
        run: python -m pytest -q

  frontend:
    name: frontend typecheck and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Typecheck
        working-directory: frontend
        run: npx tsc --noEmit
      - name: Build
        working-directory: frontend
        run: npm run build
